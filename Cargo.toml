[workspace]
resolver = "3"
members = ["retry", "resilience", "resilience-http"]
# Every member is published. Without default-members, a bare `cargo test` at
# the repository root reaches every crate anyway because this is a virtual
# manifest; listing them keeps that explicit and matches the CI commands.
default-members = ["retry", "resilience", "resilience-http"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
