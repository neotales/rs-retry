name: release

# Publishing is driven by a tag, never by a branch. The tag must equal `v` plus
# the version in every crate manifest, so the thing that ran is a thing that can
# be named.
#
# Trusted publishing: the publish job asks crates.io for a short-lived token
# over OIDC. There is no CARGO_REGISTRY_TOKEN secret in this repository.
# crates.io cannot bootstrap a crate this way. The first publish of a new crate
# is manual, through ~/work/rs/publish.sh. See RELEASE.md.
#
# The publish job sets no GitHub environment on purpose. The trusted publisher
# saved on crates.io for this organisation has an empty environment, and
# crates.io compares that field with the job's, so an environment on either side
# alone fails the token exchange.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Runs on both triggers. On workflow_dispatch this job is the whole release:
  # checks and dry runs, never a real publish. The resilience dry run may fail
  # only because its retry version is not in the index yet. That is expected on
  # the releasing commit. The publish job uploads retry first and retries.
  check:
    name: pre-publish checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --all-features

      # The README files are shipped inside the packages and compiled as
      # doctests, so a broken sample is a broken release, not a broken example.
      - name: Doc tests
        run: cargo test --workspace --doc --all-features

      # retry and resilience-http can be packaged against the registry.
      # resilience names neotales-retry by the version in this commit, which is
      # not in the index until this release uploads it. That dry-run failure is
      # expected on the releasing commit. Any other failure still fails the job.
      # See RELEASE.md.
      - name: Package without publishing
        run: |
          set -euo pipefail
          cargo publish -p neotales-retry --dry-run --locked
          cargo publish -p neotales-resilience-http --dry-run --locked
          set +e
          output=$(cargo publish -p neotales-resilience --dry-run --locked 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s\n' "$output" | grep -F 'failed to select a version for the requirement' >/dev/null \
            && printf '%s\n' "$output" | grep -F 'neotales-retry' >/dev/null \
            && printf '%s\n' "$output" | grep -F "candidate versions found which didn't match" >/dev/null; then
            echo "expected: resilience dry-run cannot see the unpublished retry version on the index yet"
            exit 0
          fi
          echo "resilience dry-run failed for a reason other than the unpublished sibling version"
          exit 1

  version:
    name: tag matches the crate versions
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the tag with all three manifests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import tomllib

          manifests = {
              "neotales-retry": "retry/Cargo.toml",
              "neotales-resilience": "resilience/Cargo.toml",
              "neotales-resilience-http": "resilience-http/Cargo.toml",
          }

          versions = {}
          for name, path in manifests.items():
              with open(path, "rb") as handle:
                  package = tomllib.load(handle).get("package")
              if not isinstance(package, dict):
                  sys.exit(f"{path} has no [package] table")
              version = package.get("version")
              if not isinstance(version, str):
                  sys.exit(
                      f"{path} [package] version is not a literal string. "
                      "Each crate must carry the published version."
                  )
              versions[name] = version

          tag = os.environ["TAG"]
          print(f"tag: {tag}")
          for name, version in versions.items():
              print(f"{name}: {version}")

          distinct = set(versions.values())
          if len(distinct) != 1:
              print(f"::error::the crates carry different versions: {versions}")
              sys.exit(1)

          expected = f"v{distinct.pop()}"
          if tag != expected:
              print(f"::error::tag {tag} does not match {expected}")
              sys.exit(1)
          PY

  publish:
    name: publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No GitHub environment, deliberately. The trusted publisher stored on
    # crates.io for this organisation has an empty environment, and crates.io
    # compares that field with the job's. Setting `environment: release` here
    # makes the OIDC token exchange fail with no other symptom. If someone ever
    # does set an environment name on crates.io, this job must set that exact
    # name. See RELEASE.md.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-publish

      # Fails when a crate does not exist on crates.io yet, or when the trusted
      # publisher does not match this repository, this workflow file and an
      # empty environment. That is the intended failure: there is nothing to
      # fall back to, and no token to widen. See RELEASE.md for the first
      # publish.
      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # One exchange covers every crate in this repository whose trusted
      # publisher matches release.yml and an empty environment. Publish retry
      # first. resilience then retries while the index catches up.
      # resilience-http does not depend on either, and still runs last so a
      # failure names the crate. A re-run skips a version already on crates.io.
      # Do not republish, and do not delete or move the tag.
      - name: Publish all three crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          version_of() {
            python3 - "$1" <<'PY'
          import sys
          import tomllib
          with open(sys.argv[1], "rb") as handle:
              version = tomllib.load(handle)["package"]["version"]
          if not isinstance(version, str):
              raise SystemExit(f"{sys.argv[1]} version is not a string")
          print(version)
          PY
          }

          registry_has() {
            local crate="$1" version="$2" code
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: neotales-release (https://github.com/neotales)' \
              "https://crates.io/api/v1/crates/${crate}/${version}" || echo 000)
            [ "$code" = "200" ]
          }

          publish_crate() {
            local package="$1" manifest="$2"
            local version attempt output status
            version=$(version_of "$manifest")
            if registry_has "$package" "$version"; then
              echo "$package $version is already on crates.io; not publishing again"
              return 0
            fi
            for attempt in $(seq 1 15); do
              set +e
              output=$(cargo publish -p "$package" --locked 2>&1)
              status=$?
              set -e
              printf '%s\n' "$output"
              if [ "$status" -eq 0 ]; then
                echo "uploaded $package $version"
                return 0
              fi
              if printf '%s\n' "$output" | grep -F 'already uploaded' >/dev/null; then
                echo "$package $version already uploaded; not publishing again"
                return 0
              fi
              if printf '%s\n' "$output" | grep -F 'failed to select a version for the requirement' >/dev/null \
                || printf '%s\n' "$output" | grep -Eiq '429|rate limit|too many requests'; then
                echo "retryable publish failure for $package (attempt $attempt); waiting 20s"
                sleep 20
                continue
              fi
              echo "publish of $package failed"
              return 1
            done
            echo "publish of $package did not succeed after retries"
            return 1
          }

          publish_crate neotales-retry retry/Cargo.toml
          publish_crate neotales-resilience resilience/Cargo.toml
          publish_crate neotales-resilience-http resilience-http/Cargo.toml
